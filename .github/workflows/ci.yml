name: GrabFlow Extension CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check popup.js
          node --check scan-page.js
          node --check asset-utils.js
          node --check background.js
          node --check vscode-companion/extension.js
      - name: Manifest privacy and least-privilege contract
        run: node tests/test-scanner.cjs
      - name: Utility, export and hidden-panel contract tests
        run: node tests/test-utilities.cjs
      - name: VS Code companion contract tests
        run: node tests/test-vscode-companion.cjs
      - name: Native companion host contract tests
        run: python3 tests/test-companion-host.py
      - name: Native Messaging trust boundary regression tests
        run: python3 tests/test-native-boundary.py
      - name: FFmpeg companion safety tests
        run: python3 tests/test-companion.py
      - name: Ensure FFmpeg for HLS integration
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Real local HLS-to-MP4 integration
        run: python3 tests/test-stream-integration.py
      - name: Real HLS master + DASH media integrity and no-clobber matrix
        run: |
          command -v ffmpeg
          command -v ffprobe
          python3 tests/test-stream-matrix.py
      - name: Real native-messaging protocol, progress, cancel and SSRF matrix
        run: python3 tests/test-companion-protocol.py
      - name: Create deterministic Chrome and Edge zips and verify their checksums
        run: python3 scripts/package.py
      - name: Stage release artifacts
        run: |
          mkdir -p artifacts
          cp ../KNOuX-GrabFlow-CHROME-v*.zip ../KNOuX-GrabFlow-EDGE-v*.zip artifacts/
          cp RELEASE_CHECKSUMS-*.sha256 artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: KNOuX-GrabFlow-packages
          path: artifacts/*
          if-no-files-found: error

  browser-e2e-and-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium + Playwright
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Ensure FFmpeg/FFprobe for real browser video integrity
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Popup browser UI in-memory smoke
        run: python tests/test-ui-inmemory.py
      - name: Popup browser UI smoke (HTTP server)
        run: python tests/test-ui.py
      - name: 20-Fixture Real Browser Matrix E2E Test Suite
        run: python tests/test-e2e-matrix.py
      - name: Real unpacked MV3 API, byte-verified download and worker persistence E2E
        run: python tests/test-real-mv3.py

  edge-runtime-windows:
    name: Real Microsoft Edge runtime QA (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright (Edge is preinstalled on the runner image)
        run: python -m pip install 'playwright==1.55.0'
      - name: Report Edge build under test
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) { $edge = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe" }
          "EDGE_PATH=$edge"
          (Get-Item $edge).VersionInfo.ProductVersion
      - name: Branded Edge load-unpacked, service worker and byte-verified downloads
        run: python tests/test-edge-runtime.py
      - name: Upload Edge evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-runtime-evidence
          path: screenshots/edge-*.png
          if-no-files-found: warn

  native-messaging-windows:
    name: Real Chrome to Native Messaging handshake (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser test runtime
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Verify native handshake and isolated registry teardown
        run: python tests/test-real-native-messaging-win.py
